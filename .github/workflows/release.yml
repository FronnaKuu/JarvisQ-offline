name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build (defaults to current ref).'
        required: false
        default: ''

# `softprops/action-gh-release` needs write access to attach assets to the
# Release. Everything else stays read-only.
permissions:
  contents: write

jobs:
  android:
    name: Build Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Free disk space
        # ubuntu-latest ships with ~14 GB free, which is not enough to
        # strip native libs for all 4 Android ABIs alongside the QVAC SDK
        # native addons. Reclaim ~14 GB by dropping toolchains we never
        # use; keep the Android SDK that setup-android refreshes below.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        # Strict peer ranges in some bare-* runtime packages need this flag.
        run: npm ci --legacy-peer-deps

      # Streaming dictation requires the parakeet streaming patch series
      # (Silero VAD + mid-segment partials), which is not yet released
      # upstream. The published `@qvac/transcription-parakeet` npm package
      # ships a stock native binding without the `startStreaming` /
      # `appendStreamingAudio` / `endStreaming` symbols, so the JS-level
      # patch in `patches/@qvac+transcription-parakeet+*.patch` would call
      # into an undefined native function.
      #
      # The Helldez/qvac fork carries the patches and produces a verified
      # android-arm64 prebuild as a tagged GitHub Release. This step pins
      # the prebuild by tag, verifies its SHA256 against a hash hardcoded
      # below, and overlays it into node_modules before `expo prebuild`
      # picks up the prebuilds for the native Android project.
      #
      # When the patches land upstream and a parakeet release ships them,
      # remove this step and bump the @qvac/transcription-parakeet
      # dependency in package.json instead.
      - name: Overlay patched parakeet prebuild from Helldez/qvac
        env:
          QVAC_PREBUILD_TAG: parakeet-streaming-1
          EXPECTED_SHA256: bfb3ee8dc092c800a20de88eeb5b35406902a82c7308efba615429e8dffee85c
        run: |
          set -euo pipefail
          ASSET="qvac__transcription-parakeet-android-arm64.bare"
          URL="https://github.com/Helldez/qvac/releases/download/${QVAC_PREBUILD_TAG}/${ASSET}"
          curl -fsSL --retry 3 --retry-delay 5 -o "${ASSET}" "${URL}"
          echo "${EXPECTED_SHA256}  ${ASSET}" | sha256sum -c -
          DEST="node_modules/@qvac/transcription-parakeet/prebuilds/android-arm64/qvac__transcription-parakeet.bare"
          if [ ! -f "${DEST}" ]; then
            echo "::error::Expected stock prebuild not found at ${DEST}"
            exit 1
          fi
          install -m 0644 "${ASSET}" "${DEST}"
          echo "Overlay complete:"
          ls -la "${DEST}"
          sha256sum "${DEST}"

      - name: Typecheck + unit tests
        # Defense in depth: ci.yml already runs these, but a release build
        # must re-verify on the exact ref it ships from.
        run: |
          npm run typecheck
          npm test

      - name: Generate native Android project
        # --clean so the release build never inherits stale state from the
        # cached working directory of a previous run.
        run: npx expo prebuild --platform android --clean

      - name: Assemble release APK
        # Only build arm64-v8a. Modern Android devices are 64-bit ARM and
        # the Play Store no longer accepts 32-bit-only uploads — shipping
        # x86/x86_64/armeabi-v7a in the APK only inflates the install size
        # and pushes the build past the runner's free disk.
        #
        # The debug keystore that expo-prebuild generates is enough for
        # internal sideload distribution. To produce a Play Store-eligible
        # APK, set `ANDROID_KEYSTORE_BASE64`, `ANDROID_KEYSTORE_PASSWORD`,
        # `ANDROID_KEY_ALIAS`, and `ANDROID_KEY_PASSWORD` as repo secrets,
        # write a `release` signingConfig in `android/app/build.gradle`,
        # and decode the keystore in a step before this one.
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify the bundle is fresh
        # Catches the silent failure where Gradle reports UP-TO-DATE but
        # the embedded JS bundle is from a previous run.
        run: |
          unzip -p android/app/build/outputs/apk/release/app-release.apk \
            assets/index.android.bundle > /tmp/b.hbc
          if ! grep -q -a "JarvisQ" /tmp/b.hbc; then
            echo "::error::Embedded bundle does not contain the JarvisQ marker — stale build."
            exit 1
          fi

      - name: Rename APK + compute SHA256
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARTIFACT="JarvisQ-${VERSION}-android-arm64-v8a.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$ARTIFACT"
          sha256sum "$ARTIFACT" | tee "${ARTIFACT}.sha256"
          {
            echo "artifact=${ARTIFACT}"
            echo "checksum=${ARTIFACT}.sha256"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.checksum }}
          retention-days: 30

      - name: Attach APK + checksum to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.checksum }}
          fail_on_unmatched_files: true

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Disable Windows Defender real-time monitoring
        shell: pwsh
        # GitHub-hosted Windows runners enable Defender by default, which
        # quarantines or locks the unsigned NSIS installer that
        # electron-builder produces. The result is a "Command failed:
        # ...x64.exe ... Exit code: null" failure when electron-builder
        # tries to read the freshly built installer's metadata. Excluding
        # the workspace and disabling real-time scanning is the standard
        # mitigation; the runner is destroyed after the job so the
        # weakened state has no lasting effect.
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          } catch {
            Write-Warning "Could not adjust Defender (already off?): $_"
          }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck + unit tests
        run: |
          npm run typecheck
          npm test

      - name: Bundle QVAC Bare worker
        # Generates qvac/worker.entry.mjs + qvac/addons.manifest.json from
        # the plugins listed in qvac.config.json. electron-builder picks
        # them up via `extraResources` and `asarUnpack` so the SDK's
        # node-rpc-client can find the worker at runtime.
        run: npm run desktop:bundle-worker

      - name: Build NSIS installer
        # Runs scripts/build-desktop.mjs (esbuild bundles the Electron
        # main into build/desktop/) then electron-builder for win-x64.
        # Output: release/desktop/win/JarvisQ-<version>-x64.exe
        run: npm run desktop:dist:win

      - name: Locate installer + compute SHA256
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $artifact = "release/desktop/win/JarvisQ-$version-x64.exe"
          if (-not (Test-Path $artifact)) {
            Write-Error "Expected installer not found at $artifact"
            exit 1
          }
          $hash = (Get-FileHash -Path $artifact -Algorithm SHA256).Hash.ToLower()
          $leaf = Split-Path $artifact -Leaf
          $sidecar = "$artifact.sha256"
          "$hash  $leaf" | Out-File -Encoding ascii -FilePath $sidecar
          "artifact=$artifact"  | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "checksum=$sidecar"   | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "version=$version"    | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Upload as workflow artifact (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.checksum }}
          retention-days: 30

      - name: Attach installer + checksum to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.checksum }}
          fail_on_unmatched_files: true
